name: muster
on:
  pull_request:
    branches: [muster-fixtures, json-to-yaml]
permissions:
  contents: read
  pull-requests: write
jobs:
  muster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: WarHub/muster@main
        id: muster
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
      - name: Comment blast radius on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: muster
          path: muster-report.md
